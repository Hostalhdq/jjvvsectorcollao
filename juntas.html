<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Las juntas · Sector Collao</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <header id="encabezado"></header>

  <main id="contenido">
    <div class="titulo-pagina">
      <div class="contenedor">
        <h1>Las 12 juntas de vecinos</h1>
        <p>Una sola voz por cerca de 35 mil habitantes de Collao.</p>
      </div>
    </div>

    <section>
      <div class="contenedor">
        <div id="juntas" class="grilla grilla-3"></div>
      </div>
    </section>

    <section class="alt" id="calendario">
      <div class="contenedor">
        <h2>Calendario de reuniones</h2>
        <div id="reuniones" class="grilla"></div>
      </div>
    </section>
  </main>

  <footer id="pie"></footer>

  <script src="js/datos.js"></script>
  <script src="js/comun.js"></script>
  <script>
    document.getElementById("juntas").innerHTML = JUNTAS.map((j) => `
      <article class="tarjeta" id="${j.id}">
        <h2 style="font-size:1.2rem">${escaparHTML(j.nombre)}</h2>
        <p><strong>Presidente/a:</strong> ${j.presidente ? escaparHTML(j.presidente) : "<span class='ayuda'>Por confirmar</span>"}</p>
        ${j.contacto ? `<p><strong>Contacto:</strong> <a href="tel:${soloDigitos(j.contacto)}">${escaparHTML(j.contacto)}</a></p>` : ""}
        ${j.sede ? `<p><strong>Sede:</strong> <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(j.sede + ", Concepción, Chile")}" target="_blank" rel="noopener">${escaparHTML(j.sede)}</a></p>` : ""}
        <p><strong>Problemas conocidos:</strong></p>
        ${j.problemas.length
          ? `<ul>${j.problemas.map((p) => `<li>${escaparHTML(p)}</li>`).join("")}</ul>`
          : `<p class="ayuda">Por completar. <a href="reportar.html">Reporta un rebalse</a> para sumar evidencia.</p>`}
      </article>`).join("");

    const reuniones = proximasReuniones();
    document.getElementById("reuniones").innerHTML = reuniones.length
      ? reuniones.map(tarjetaReunion).join("")
      : "<p>No hay reuniones agendadas por ahora. Consulta con la directiva de tu junta.</p>";
  </script>
</body>
</html>
